# -----------------------------------------------------------------------------
# GitLab CI pipeline: запуск UI-тестов, генерация отчёта Allure и публикация
# я установил Gitlab runner себе на комп с 7 раза все заработало.
#В секции [[runners]] найдите строку shell = "pwsh" и замените её на: shell = "powershell"
# -----------------------------------------------------------------------------

stages:
  - test
  - report
  - deploy


# -----------------------------------------------------------------------------
# Джоба 1: запуск автотестов и сохранение allure-results
# -----------------------------------------------------------------------------
run-tests:
  stage: test
  image: ubuntu:24.04

  allow_failure: true
  tags:
    - linux

  before_script:
    - apt-get update
    - apt-get install -y python3.12 python3.12-venv python3-pip
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - playwright install --with-deps

  script:
    - pytest -m regression --alluredir=allure-results --numprocesses 2

  artifacts:
    paths:
      - allure-results/
    expire_in: 7 days
    when: always

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# -----------------------------------------------------------------------------
# Джоба 2: генерация Allure-отчёта из allure-results
# -----------------------------------------------------------------------------
publish-report:
  stage: report
  image: ubuntu:24.04
  tags:
    - linux

  # ★ ВОЗВРАЩАЕМ optional: true, чтобы отчёт генерировался даже при падении тестов
  needs:
    - job: run-tests
      optional: true

  before_script:
    - apt-get update
    - apt-get install -y openjdk-17-jre-headless wget tar
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
    - tar -xvf allure-2.32.0.tgz

  script:
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean

  artifacts:
    paths:
      - allure-report/
    expire_in: 7 days
    when: always

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# -----------------------------------------------------------------------------
# Джоба 3: публикация отчёта на GitLab Pages
# -----------------------------------------------------------------------------
pages:
  stage: deploy
  image: ubuntu:24.04
  tags:
    - linux

  needs:
    - publish-report

  script:
    - mkdir -p public
    - cp -r allure-report/* public/

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'