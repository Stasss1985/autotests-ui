name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # ---- НОВЫЕ ШАГИ ДЛЯ ALLURE ----

      - name: Get Allure history from gh-pages
        run: |
          git clone --depth=1 --branch=gh-pages https://github.com/${{ github.repository }}.git gh-pages || echo "No gh-pages branch yet"
          # Если ветка gh-pages существует, но папки last-history нет – создаём пустую
          if [ -d "gh-pages" ]; then
            mkdir -p gh-pages/last-history
          else
            mkdir -p gh-pages/last-history
          fi

      - name: Generate Allure Report with history
        uses: allure-framework/allure-github-actions@v2
        with:
          results_dir: allure-results
          history_dir: gh-pages/last-history

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true   # чтобы не затирать старые отчёты