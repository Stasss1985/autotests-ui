name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # ---- Установка Allure (исправлено) ----
      - name: Install Allure command line
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jre-headless wget
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      # ---- Работа с историей и генерация отчёта ----
      - name: Get previous Allure history (if exists)
        run: |
          git clone --depth=1 --branch=gh-pages https://github.com/${{ github.repository }}.git gh-pages || echo "No gh-pages yet"
          mkdir -p allure-history  # папка для будущего отчёта
          if [ -d "gh-pages/last-history" ]; then
            cp -r gh-pages/last-history allure-results/history || true
          else
            echo "No history found, starting fresh"
          fi

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Save report with history for next run
        run: |
          mkdir -p allure-history
          cp -r allure-report/history allure-history/last-history
          cp -r allure-report/* allure-history/

      # ---- Деплой ----
      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true