name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # ---- ВСТАВЛЯЕМ РУЧНУЮ ГЕНЕРАЦИЮ ALLURE ----

      - name: Install Allure command line
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jre-headless wget
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure_2.29.0-1_all.deb
          sudo dpkg -i allure_2.29.0-1_all.deb
          allure --version

      - name: Get previous Allure history (if exists)
        run: |
          git clone --depth=1 --branch=gh-pages https://github.com/${{ github.repository }}.git gh-pages || echo "No gh-pages yet"
          mkdir -p allure-history  # создаём папку для будущего отчёта
          # если есть папка с историей – копируем её в allure-results для формирования истории
          if [ -d "gh-pages/last-history" ]; then
            cp -r gh-pages/last-history allure-results/history || true
          else
            echo "No history found, starting fresh"
          fi

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Save report with history for next run
        run: |
          # Копируем историю из сгенерированного отчёта в отдельную папку для деплоя
          mkdir -p allure-history
          cp -r allure-report/history allure-history/last-history
          # Также копируем весь отчёт в allure-history (для публикации)
          cp -r allure-report/* allure-history/

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true